[project]
name = "clonecraft"
version = "0.1.0"
description = "Turn a finished Script into a talking-head Video of a Persona, entirely locally"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1", "pyyaml>=6.0"]

[project.scripts]
clonecraft = "clonecraft.cli:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "types-pyyaml",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clonecraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
